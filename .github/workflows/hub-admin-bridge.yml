name: Hosted Intel administration bridge
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/intelHubAdmin.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check --node-modules-dir=none --no-lock --no-config base44/functions/centralAdminRead/entry.ts
        env:
          DENO_NO_PACKAGE_JSON: "1"
